# Resolve upstreams dynamically so nginx survives container IP changes.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep HTTPS when TLS is terminated in front of nginx (ngrok, a load balancer).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Public media via MinIO (path-style bucket). Keeps browser off minio:9000.
    location /media/ {
        set $minio_upstream http://minio:9000;
        rewrite ^/media/(.*)$ /studio-media/$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        set $django_upstream http://backend:8000;
        proxy_pass $django_upstream;
        # Prefer $http_host so Django keeps the public port (e.g. :8080).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        set $django_upstream http://backend:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /health/ {
        set $django_upstream http://backend:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
